# ── Upstream Backend ─────────────────────────────────────────────────────────
upstream sokora_api {
    server backend:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect + Certbot challenge ────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tout le reste vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name SOKORA_DOMAIN;   # Remplacé par envsubst au démarrage

    ssl_certificate     /etc/letsencrypt/live/SOKORA_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SOKORA_DOMAIN/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # ── API REST ──────────────────────────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://sokora_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://sokora_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SOKORA Sport — application installable (PWA) ──────────────────────────
    # Servie sous /sport/ pour cohabiter avec le frontend principal. Le build
    # de sport-dashboard utilise des chemins relatifs (base './'), donc aucune
    # reconfiguration n'est nécessaire côté application.
    location = /sport {
        return 301 /sport/;
    }

    location /sport/ {
        root /usr/share/nginx/html;          # sert /usr/share/nginx/html/sport/
        try_files $uri $uri/ /sport/index.html;

        # Le service worker ne doit jamais être servi depuis un cache : sinon
        # une version corrigée de l'application pourrait n'atteindre jamais un
        # téléphone qui a déjà installé l'ancienne.
        location = /sport/sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Le manifeste change rarement mais doit rester frais pour que l'icône
        # et le nom affichés restent justes.
        location = /sport/manifest.webmanifest {
            add_header Cache-Control "no-cache" always;
        }

        # Ressources hachées par Vite : leur nom change à chaque build, elles
        # peuvent donc être mises en cache sans limite.
        location ~* ^/sport/assets/.+\.(js|css|woff2?|png|jpe?g|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Frontend React (SPA) ──────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache assets hachés
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
