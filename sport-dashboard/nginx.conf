# Configuration du conteneur qui sert le tableau de bord en local.
#
# Le point important est le bloc /api/ : l'application et l'API sont servies par
# la même origine (le port 5177), donc aucune question de CORS ne se pose, et
# l'adresse de l'API reste le chemin relatif `/api` — celui-là même qui est figé
# à la compilation. C'est le montage de production reproduit à l'identique, en
# plus simple.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit jamais être mis en cache : sans cela, une
    # correction n'atteindrait jamais un navigateur qui a déjà l'ancien.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Les noms des fichiers construits par Vite contiennent une empreinte :
    # un nouveau contenu porte un nouveau nom, donc le cache long est sûr.
    location ~* ^/assets/.+\.(js|css|woff2?|png|jpe?g|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Relais vers le backend. `api` est le nom du service dans docker-compose.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # le backtest et la carte des avantages calculent
    }
}
