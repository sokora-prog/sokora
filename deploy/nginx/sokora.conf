# ── KYRION Trading PWA ─────────────────────────────────────────────
server {
    listen 80;
    server_name app.kyrion.io kyrion.io;

    root /var/www/kyrion/dist;
    index index.html;

    # PWA — toutes les routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA Manifest & Service Worker — pas de cache
    location ~* (manifest\.json|sw\.js|workbox-.*)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── API KYRION Backend (si séparé) ────────────────────────────────
server {
    listen 80;
    server_name api.kyrion.io;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
